[project]
name = "gastos"
version = "0.1.0"
description = "Pipeline pessoal de reconciliação e classificação de gastos (Mercado Livre, NFC-e, extrato bancário)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "pydantic>=2.7",
    "structlog>=24.1",
    "tenacity>=8.2",
    "anthropic>=0.34",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gastos"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
